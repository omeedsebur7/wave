name: wave
description: WAVE — social commerce. Reels that convert directly to sales.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.4.3
  cloud_functions: ^5.1.3
  connectivity_plus: ^6.0.5
  dartz: ^0.10.1
  equatable: ^2.0.5
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.1+3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_performance: ^0.10.0+8
  firebase_remote_config: ^5.1.3
  firebase_storage: ^12.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_native_splash: any
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  get_it: ^8.0.0
  go_router: ^14.3.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  sign_in_with_apple: ^6.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_compress: ^3.1.3
  video_player: ^2.9.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  custom_lint: any
  fake_cloud_firestore: ^3.0.3
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  wave_lints:
    path: packages/wave_lints

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/images/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: "assets/brand/splash.png"
  image_dark: "assets/brand/splash.png"
  android_12:
    image: "assets/brand/splash_android12.png"
    image_dark: "assets/brand/splash_android12.png"
    color: "#000000"
    color_dark: "#000000"
  android: true
  ios: true
  web: false
  fullscreen: true