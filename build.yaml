# Code generation config — DORMANT. Nothing in this project currently needs it.
#
# There is no `build_runner` step anywhere in the workflow: not in the README's
# setup instructions, not in CI. Both builders below are configured and neither
# has anything to generate, because `lib/` contains zero `@InjectableInit`, zero
# `@JsonSerializable`, zero `@freezed` and zero `part` directives. Running
# `dart run build_runner build` today succeeds and emits no files.
#
# This file is kept rather than deleted, for two specific reasons:
#
# 1. Every repository and BLoC still carries its `@injectable` /
#    `@LazySingleton` annotation. DI is registered by hand in
#    `lib/app/di/injector.dart` — that file explains why: hand-written wiring
#    runs on a fresh clone before any codegen, and it is the file a new engineer
#    reads to learn what depends on what. Keeping the annotations plus this
#    config means switching to generated wiring is adding one `@InjectableInit`
#    and running build_runner, rather than reconstructing the builder
#    configuration from scratch.
#
# 2. `field_rename: snake` is the non-obvious half. Every Firestore document in
#    this project uses snake_case field names while Dart uses camelCase, and the
#    hand-written DTOs do that mapping explicitly. If generated serialization is
#    ever adopted, this option is what makes the generated code agree with the
#    existing documents instead of silently writing camelCase keys alongside the
#    snake_case ones already in the database — a data-corruption bug that would
#    present as missing fields rather than as a config mistake.
#
# So: dormant on purpose, and the settings here are the ones a future migration
# needs to get right. Do not add a build_runner step to CI on the strength of
# this file existing; see the note on the analyze job in
# `.github/workflows/ci.yaml`.
targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        generate_for:
          - lib/**
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
