name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      # Separate step on purpose: `flutter analyze` does not run analyzer
      # plugins, so the WAVE lints are invisible to the step above.
      - name: WAVE design-system lints
        run: dart run tool/check_lints.dart

      # Goldens are platform-specific. These were generated on Windows, so
      # they will differ here until they are regenerated on Linux. Until that
      # is settled, exclude them rather than let CI fail on font rasterisation.
      - name: Test
        run: flutter test --exclude-tags golden
